<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="crossword-page">
    <div id="crossword"></div>
    <button id="check">Check</button>
</div>

<script>
const grid = [
    "        H       ",
    "        M E     ",
    "        O ANGEL",
    "        O R    O",
    "      SUNSETS  V",
    "      T      T E",
    "      R      A  ",
    "    BEACH    R  ",
    "      W         ",
    "      B         ",
    "      E         ",
    "      R         ",
    "   M  R         ",
    "  LILLY         ",
    " M K            ",
    "BAKUGO          ",
    " G    C         ",
    " I  DREAM       ",
    " C    A         ",
    "  BUNNY         "
];

const crossword = document.getElementById("crossword");

for (let row = 0; row < 20; row++) {
    for (let col = 0; col < 16; col++) {
        const cell = document.createElement("div");

        if (grid[row][col] !== " ") {
            cell.className = "cell";

            const input = document.createElement("input");
            input.maxLength = 1;
            input.autocomplete = "off";
            input.autocapitalize = "characters";
            input.dataset.row = row;
            input.dataset.col = col;

            input.addEventListener("input", () => {
                input.value = input.value
                    .replace(/[^a-zA-Z]/g, "")
                    .toUpperCase();

                if (input.value) {
                    const next = findInput(row, col, 1);
                    if (next) next.focus();
                }
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Backspace" && !input.value) {
                    const previous = findInput(row, col, -1);
                    if (previous) previous.focus();
                }
            });

            cell.appendChild(input);
        } else {
            cell.className = "blocked";
        }

        crossword.appendChild(cell);
    }
}

function findInput(row, col, direction) {
    const inputs = [...document.querySelectorAll("input")];
    const current = inputs.findIndex(
        input =>
            Number(input.dataset.row) === row &&
            Number(input.dataset.col) === col
    );

    return inputs[current + direction] || null;
}

document.getElementById("check").addEventListener("click", () => {
    let correct = true;

    document.querySelectorAll(".cell").forEach(cell => {
        cell.classList.remove("wrong", "correct");
    });

    for (let row = 0; row < 20; row++) {
        for (let col = 0; col < 16; col++) {
            if (grid[row][col] === " ") continue;

            const input = document.querySelector(
                `input[data-row="${row}"][data-col="${col}"]`
            );

            if (input.value.toUpperCase() === grid[row][col]) {
                input.parentElement.classList.add("correct");
            } else {
                input.parentElement.classList.add("wrong");
                correct = false;
            }
        }
    }

    if (correct) {
        localStorage.setItem("crosswordComplete", "true");

        setTimeout(() => {
            window.location.href = "secret.html";
        }, 700);
    }
});
</script>

</body>
</html>
