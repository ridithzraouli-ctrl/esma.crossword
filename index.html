<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="decorations">
    <span>✦</span>
    <span>✧</span>
    <span>⋆</span>
    <span>✦</span>
    <span>˚</span>
    <span>✧</span>
    <span>⋆</span>
    <span>✦</span>
</div>

<main>
    <div class="ornament">
        <span>✦</span>
        <i></i>
        <span>✧</span>
        <i></i>
        <span>✦</span>
    </div>

    <div id="crossword"></div>

    <div class="ornament bottom">
        <span>✧</span>
        <i></i>
        <span>♡</span>
        <i></i>
        <span>✧</span>
    </div>

    <button id="check">Check</button>
</main>

<script>
const grid = [
    ".D.........",
    ".R........B",
    ".E..O..L..U",
    "MAGICMOON.N",
    "IM..E..V..N",
    "KSTRAWBERRY",
    "UTSUNSETS..",
    "BAKUGOA....",
    ".R..E.C....",
    ".LILLYHEART"
];

const crossword = document.getElementById("crossword");
const inputs = [];

for (let row = 0; row < grid.length; row++) {
    for (let col = 0; col < grid[row].length; col++) {

        const cell = document.createElement("div");

        if (grid[row][col] === ".") {
            cell.className = "blocked";
        } else {
            cell.className = "cell";

            const input = document.createElement("input");

            input.type = "text";
            input.maxLength = 1;
            input.autocomplete = "off";
            input.autocapitalize = "characters";
            input.dataset.answer = grid[row][col];

            input.addEventListener("input", () => {
                input.value = input.value
                    .replace(/[^a-zA-Z]/g, "")
                    .toUpperCase();

                if (input.value) {
                    const next = inputs[inputs.indexOf(input) + 1];
                    if (next) next.focus();
                }
            });

            input.addEventListener("keydown", event => {
                if (event.key === "Backspace" && !input.value) {
                    const previous = inputs[inputs.indexOf(input) - 1];
                    if (previous) previous.focus();
                }
            });

            inputs.push(input);
            cell.appendChild(input);
        }

        crossword.appendChild(cell);
    }
}

document.getElementById("check").addEventListener("click", () => {
    let solved = true;

    inputs.forEach(input => {
        input.parentElement.classList.remove("wrong", "correct");

        if (input.value.toUpperCase() === input.dataset.answer) {
            input.parentElement.classList.add("correct");
        } else {
            input.parentElement.classList.add("wrong");
            solved = false;
        }
    });

    if (solved) {
        localStorage.setItem("crosswordComplete", "true");
        document.body.classList.add("solved");

        setTimeout(() => {
            window.location.href = "secret.html";
        }, 900);
    }
});
</script>

</body>
</html>
