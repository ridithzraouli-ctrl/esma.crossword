<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars">
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
</div>

<div class="sparkles">
    <span>⋆</span>
    <span>˚</span>
    <span>⋆</span>
    <span>˚</span>
    <span>⋆</span>
    <span>˚</span>
</div>

<main class="crossword-page">

    <div class="top-decoration">
        <span>✦</span>
        <i></i>
        <span>✧</span>
        <i></i>
        <span>✦</span>
    </div>

    <div id="crossword"></div>

    <div class="bottom-decoration">
        <span>✧</span>
        <i></i>
        <span>♡</span>
        <i></i>
        <span>✧</span>
    </div>

    <button id="check">Check</button>

</main>

<script>
const grid = [
    "..........H.....",
    "........M..E....",
    "........O..ANGEL",
    "........O.R....O",
    "......SUNSETS...",
    "......T......T.E",
    "......R......A..",
    "....BEACH...R...",
    "......W.........",
    "......B.........",
    "......E.........",
    "......R.........",
    "...M.R..........",
    "..LILLY.........",
    ".M.K............",
    "BAKUGO..........",
    ".G....C.........",
    ".I.DREAM........",
    ".C....A.........",
    "..BUNNY........."
];

const crossword = document.getElementById("crossword");
const inputs = [];

for (let row = 0; row < 20; row++) {
    for (let col = 0; col < 16; col++) {

        const cell = document.createElement("div");

        if (grid[row][col] !== ".") {

            cell.className = "cell";

            const input = document.createElement("input");

            input.type = "text";
            input.maxLength = 1;
            input.autocomplete = "off";
            input.autocapitalize = "characters";

            input.dataset.answer = grid[row][col];

            input.addEventListener("input", () => {
                input.value = input.value
                    .replace(/[^a-zA-Z]/g, "")
                    .toUpperCase();

                if (input.value) {
                    const next = inputs[inputs.indexOf(input) + 1];
                    if (next) next.focus();
                }
            });

            input.addEventListener("keydown", event => {
                if (event.key === "Backspace" && !input.value) {
                    const previous = inputs[inputs.indexOf(input) - 1];
                    if (previous) previous.focus();
                }
            });

            inputs.push(input);
            cell.appendChild(input);

        } else {
            cell.className = "blocked";
        }

        crossword.appendChild(cell);
    }
}

document.getElementById("check").addEventListener("click", () => {

    let solved = true;

    inputs.forEach(input => {

        input.parentElement.classList.remove("correct", "wrong");

        if (input.value.toUpperCase() === input.dataset.answer) {
            input.parentElement.classList.add("correct");
        } else {
            input.parentElement.classList.add("wrong");
            solved = false;
        }
    });

    if (solved) {

        localStorage.setItem("crosswordComplete", "true");

        document.body.classList.add("solved");

        setTimeout(() => {
            window.location.href = "secret.html";
        }, 900);
    }
});
</script>

</body>
</html>
