<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations! ♡</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 12%, #f3dce3 0, transparent 25%),
                radial-gradient(circle at 88% 82%, #ead3dc 0, transparent 27%),
                #faf5f2;
            color: #60434c;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 12px;
        }

        main {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .title {
            margin-bottom: 20px;
            color: #815363;
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            height: 22px;
            margin-bottom: 25px;
            color: #b8798b;
        }

        .ornament.bottom {
            margin: 25px 0 0;
        }

        .ornament span { font-size: 16px; }
        .ornament i {
            width: 40px;
            height: 1px;
            background: #d4adb8;
        }

        /* PHOTO & SONG CARD */

        .photo-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #ffffff;
            border: 1px solid #a96e81;
            border-radius: 12px;
            padding: 14px;
            box-shadow:
                0 3px 0 rgba(91, 52, 65, .12),
                0 15px 35px rgba(91, 52, 65, .14),
                0 0 0 6px rgba(255, 255, 255, .65);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            max-width: 320px;
            width: 100%;
            margin-bottom: 12px;
        }

        .photo-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 6px 0 rgba(91, 52, 65, .12),
                0 20px 40px rgba(91, 52, 65, .18),
                0 0 0 6px rgba(255, 255, 255, .8);
        }

        .photo-frame {
            width: 100%;
            height: 260px;
            border-radius: 8px;
            overflow: hidden;
            background: #f8dfe4;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .caption {
            margin-top: 12px;
            font-size: 14px;
            color: #815363;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* SUBTEXT MESSAGE */

        .subtext {
            margin-top: 20px;
            font-size: 13px;
            color: #ad7a89;
            letter-spacing: 0.8px;
            line-height: 1.6;
            max-width: 380px;
        }

        /* DECORATIONS */

        .decorations {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .decorations span {
            position: absolute;
            color: #c78b9c;
            opacity: .55;
            animation: float 5s ease-in-out infinite;
        }

        .decorations span:nth-child(1) { top: 8%; left: 8%; font-size: 20px; }
        .decorations span:nth-child(2) { top: 16%; right: 10%; font-size: 13px; }
        .decorations span:nth-child(3) { top: 42%; left: 5%; font-size: 12px; }
        .decorations span:nth-child(4) { top: 37%; right: 5%; font-size: 20px; }
        .decorations span:nth-child(5) { bottom: 18%; left: 9%; font-size: 12px; }
        .decorations span:nth-child(6) { bottom: 25%; right: 8%; font-size: 17px; }
        .decorations span:nth-child(7) { bottom: 8%; left: 28%; font-size: 10px; }
        .decorations span:nth-child(8) { top: 9%; right: 30%; font-size: 11px; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-7px) rotate(7deg); }
        }

        /* MOBILE ADJUSTMENTS */

        @media (max-width: 600px) {
            .title {
                font-size: 21px;
                letter-spacing: 2px;
            }

            .photo-frame {
                height: 220px;
            }

            .caption {
                font-size: 13px;
            }

            .subtext {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="decorations">
        <span>✦</span>
        <span>✧</span>
        <span>♡</span>
        <span>✦</span>
        <span>✧</span>
        <span>♡</span>
        <span>✦</span>
        <span>✧</span>
    </div>

    <main>
        <div class="ornament">
            <span>✦</span>
            <i></i>
            <span>♡</span>
            <i></i>
            <span>✦</span>
        </div>

        <div class="title">CONGRATULATIONS BABY</div>

        <!-- CLICKABLE PHOTO (Leads to Spotify / Song URL) -->
        <a href="YOUR_SONG_LINK_HERE" target="_blank" rel="noopener noreferrer" class="photo-card">
            <div class="photo-frame">
                <img src="YOUR_IMAGE_URL_HERE" alt="Reminded me of you">
            </div>
            <div class="caption">reminded me of you ^_^</div>
        </a>

        <div class="subtext">
            good job baby I'm so proud of you i hope you had funn
        </div>

        <div class="ornament bottom">
            <span>✧</span>
            <i></i>
            <span>♡</span>
            <i></i>
            <span>✧</span>
        </div>
    </main>

</body>
</html>
