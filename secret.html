<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ For You ♡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="secret">

    <div class="floating-heart heart-one">♡</div>
    <div class="floating-heart heart-two">♡</div>
    <div class="floating-heart heart-three">♡</div>

    <main class="secret-card">

        <div class="secret-symbol">✦</div>

        <h1>You found it ♡</h1>

        <div class="message">
            <p>
                YOUR MESSAGE GOES HERE
            </p>

            <p>
                Write whatever you want here. This little page is just for her ♡
            </p>
        </div>

        <div class="divider">♡</div>

        <p class="click-text">There's something else waiting for you...</p>

        <a
            class="secret-picture"
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img src="https://picsum.photos/600/400" alt="A little surprise">
            <span>♡</span>
        </a>

        <p class="under-picture">click the picture ♡</p>

    </main>

</body>
</html>
